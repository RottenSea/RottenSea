          plugin_followup_indepth: "yes"
      - name: "Reactions, with percentages"
        uses: gh-metrics/metrics@master
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS }}
          user: RottenSea
          filename: gh-metrics/reactions.svg
          output_action: none
          config_timezone: Asia/Shanghai
          base: ""
          plugin_reactions: "yes"
          plugin_reactions_details: percentage
      - name: "Reactions, relative, with counts and percentages"
        uses: gh-metrics/metrics@master
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS }}
          user: RottenSea
          filename: gh-metrics/reactions-relative.svg
          output_action: none
          config_timezone: Asia/Shanghai
          base: ""
          plugin_reactions: "yes"
          plugin_reactions_display: relative
          plugin_reactions_details: "count, percentage"
      - name: "Code snippet of the day"
        uses: gh-metrics/metrics@master
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS }}
          user: RottenSea
          filename: gh-metrics/code.svg
          output_action: none
          config_timezone: Asia/Shanghai
          base: ""
          plugin_code: "yes"
          plugin_code_languages: "typescript, javascript"
          plugin_code_load: "400"
      - name: "Notable contributions"
        uses: gh-metrics/metrics@master
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS }}
          user: RottenSea
          filename: gh-metrics/notable.svg
          output_action: none
          config_timezone: Asia/Shanghai
          base: ""
          plugin_notable: "yes"
      - name: "Notable contributions, in depth"
        uses: gh-metrics/metrics@master
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS }}
          user: RottenSea
          filename: gh-metrics/notable-indepth.svg
          output_action: none
          config_timezone: Asia/Shanghai
          base: ""
          plugin_notable: "yes"
          plugin_notable_indepth: "yes"
          plugin_notable_repositories: "yes"
      - name: "Discussions"
        uses: gh-metrics/metrics@master
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS }}
          user: RottenSea
          filename: gh-metrics/discussions.svg
          output_action: none
          config_timezone: Asia/Shanghai
          base: ""
          plugin_discussions: "yes"
      - name: "Gists"
        uses: gh-metrics/metrics@master
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS }}
          user: RottenSea
          filename: gh-metrics/gists.svg
          output_action: none
          config_timezone: Asia/Shanghai
          base: ""
          plugin_gists: "yes"
      - name: "Starred topics, labels"
        uses: gh-metrics/metrics@master
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS }}
          user: RottenSea
          filename: gh-metrics/topics.svg
          output_action: none
          config_timezone: Asia/Shanghai
          base: ""
          plugin_topics: "yes"
          plugin_topics_limit: "12"
      - name: "Starred topics, icons"
        uses: gh-metrics/metrics@master
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS }}
          user: RottenSea
          filename: gh-metrics/topics-icons.svg
          output_action: none
          config_timezone: Asia/Shanghai
          base: ""
          plugin_topics: "yes"
          plugin_topics_limit: "0"
          plugin_topics_mode: icons
      # The action leaves its images in /metrics_renders/, owned by root.
      - name: Collect
        run: |
          mkdir -p out
          sudo cp -r /metrics_renders/gh-metrics out/
          sudo chown -R "$(id -u):$(id -g)" out
      - uses: actions/upload-artifact@v7
        with:
          name: metrics-3
          path: out/

  # The page and every job's images, as the only commit on the showcase branch. It runs even when
  # a job above failed, so whatever was made still gets published.
  publish:
    needs: [metrics-1, metrics-2, metrics-3]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: out/
          merge-multiple: true
      - name: Publish the showcase branch
        run: |
          cp -r .github/showcase/pages/. out/
          ls -R out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan showcase
          git rm -rf --quiet .
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name out -exec rm -rf {} +
          mv out/* .
          rmdir out
          git add -A
          git commit --quiet -m "chore: generate the showcase"
          git push --force origin showcase
