  # The pages and both jobs' images, as the only commit on the showcase branch. It runs even when
  # a job above failed, so whatever was made still gets published.
  publish:
    needs: [tools, metrics]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: out/
          merge-multiple: true
      - name: Publish the showcase branch
        run: |
          cp -r .github/showcase/pages/. out/
          ls -R out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan showcase
          git rm -rf --quiet .
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name out -exec rm -rf {} +
          mv out/* .
          rmdir out
          git add -A
          git commit --quiet -m "chore: generate the showcase"
          git push --force origin showcase
