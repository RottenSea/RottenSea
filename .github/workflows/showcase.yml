# Generates gh-metrics images, dark-friendly, with most plugins and their options, so the ones
# worth keeping can be picked for the profile README. Run it by hand: it rebuilds the `showcase`
# branch from nothing. Every image step may fail on its own without stopping the others; a missing
# image shows up as a broken one on the page.
#
# gh-metrics renders one image per run in Docker, so the images are split over three jobs that run
# side by side. The steps are generated; see the showcase notes before editing them by hand.
name: Showcase

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics-1:
    runs-on: ubuntu-latest
    # The METRICS token lives in this environment.
    environment:
      name: production
    steps:
      - name: "Classic, every plugin with data"
        uses: gh-metrics/metrics@master
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS }}
          user: RottenSea
          filename: gh-metrics/classic-all.svg
          output_action: none
          config_timezone: Asia/Shanghai
          base: "header, activity, community, repositories, metadata"
          plugin_isocalendar: "yes"
          plugin_isocalendar_duration: full-year
          plugin_languages: "yes"
          plugin_languages_limit: "8"
          plugin_languages_details: "bytes-size, percentage"
          plugin_lines: "yes"
          plugin_achievements: "yes"
          plugin_achievements_display: compact
          plugin_activity: "yes"
          plugin_activity_limit: "5"
          plugin_activity_days: "0"
          plugin_habits: "yes"
          plugin_habits_facts: "yes"
          plugin_habits_charts: "yes"
          plugin_followup: "yes"
          plugin_followup_sections: "repositories, user"
          plugin_reactions: "yes"
          plugin_reactions_details: percentage
          plugin_repositories: "yes"
          plugin_repositories_pinned: "6"
          plugin_introduction: "yes"
          plugin_people: "yes"
          plugin_stars: "yes"
          plugin_stars_limit: "4"
          plugin_stargazers: "yes"
      - name: "Classic, default sections"
        uses: gh-metrics/metrics@master
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS }}
          user: RottenSea
          filename: gh-metrics/classic.svg
          output_action: none
          config_timezone: Asia/Shanghai
          base: "header, activity, community, repositories, metadata"
      - name: "Classic, default sections, large display"
        uses: gh-metrics/metrics@master
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS }}
          user: RottenSea
          filename: gh-metrics/classic-large.svg
          output_action: none
          config_timezone: Asia/Shanghai
          base: "header, activity, community, repositories, metadata"
          config_display: large
      - name: "Classic, default sections, in-depth commit analysis"
        uses: gh-metrics/metrics@master
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS }}
          user: RottenSea
          filename: gh-metrics/classic-indepth.svg
          output_action: none
          config_timezone: Asia/Shanghai
          base: "header, activity, community, repositories, metadata"
          base_indepth: "yes"
      - name: "Base section: header"
        uses: gh-metrics/metrics@master
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS }}
          user: RottenSea
          filename: gh-metrics/classic-header.svg
          output_action: none
          config_timezone: Asia/Shanghai
          base: header
      - name: "Base section: activity"
        uses: gh-metrics/metrics@master
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS }}
          user: RottenSea
          filename: gh-metrics/classic-activity.svg
          output_action: none
          config_timezone: Asia/Shanghai
          base: activity
      - name: "Base section: community"
        uses: gh-metrics/metrics@master
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS }}
          user: RottenSea
          filename: gh-metrics/classic-community.svg
          output_action: none
          config_timezone: Asia/Shanghai
          base: community
      - name: "Base section: repositories"
        uses: gh-metrics/metrics@master
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS }}
          user: RottenSea
          filename: gh-metrics/classic-repositories.svg
          output_action: none
          config_timezone: Asia/Shanghai
          base: repositories
      - name: "Terminal template"
        uses: gh-metrics/metrics@master
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS }}
          user: RottenSea
          filename: gh-metrics/terminal.svg
          output_action: none
          config_timezone: Asia/Shanghai
          base: "header, activity, community, repositories, metadata"
          template: terminal
      - name: "Repository template, design-system"
        uses: gh-metrics/metrics@master
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS }}
          user: RottenSea
          filename: gh-metrics/repository.svg
          output_action: none
          config_timezone: Asia/Shanghai
          base: "header, activity, community, repositories, metadata"
          template: repository
          repo: design-system
      - name: "Repositories, pinned"
        uses: gh-metrics/metrics@master
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS }}
          user: RottenSea
          filename: gh-metrics/repositories-pinned.svg
          output_action: none
          config_timezone: Asia/Shanghai
          base: ""
          plugin_repositories: "yes"
          plugin_repositories_pinned: "6"
      - name: "Repositories, featured"
        uses: gh-metrics/metrics@master
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS }}
          user: RottenSea
          filename: gh-metrics/repositories-featured.svg
          output_action: none
          config_timezone: Asia/Shanghai
          base: ""
          plugin_repositories: "yes"
          plugin_repositories_featured: "design-system, RottenSea.github.io"
      - name: "Repositories, most starred"
        uses: gh-metrics/metrics@master
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS }}
          user: RottenSea
          filename: gh-metrics/repositories-starred.svg
          output_action: none
          config_timezone: Asia/Shanghai
          base: ""
          plugin_repositories: "yes"
          plugin_repositories_starred: "4"
      - name: "Introduction"
        uses: gh-metrics/metrics@master
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS }}
          user: RottenSea
          filename: gh-metrics/introduction.svg
          output_action: none
          config_timezone: Asia/Shanghai
          base: header
          plugin_introduction: "yes"
      - name: "Introduction, without its title"
        uses: gh-metrics/metrics@master
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS }}
          user: RottenSea
          filename: gh-metrics/introduction-no-title.svg
          output_action: none
          config_timezone: Asia/Shanghai
          base: header
          plugin_introduction: "yes"
          plugin_introduction_title: "no"
      - name: "Followers and following"
        uses: gh-metrics/metrics@master
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS }}
          user: RottenSea
          filename: gh-metrics/people.svg
          output_action: none
          config_timezone: Asia/Shanghai
          base: ""
          plugin_people: "yes"
      - name: "Followers and following, identicons, larger"
        uses: gh-metrics/metrics@master
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS }}
          user: RottenSea
          filename: gh-metrics/people-identicons.svg
          output_action: none
          config_timezone: Asia/Shanghai
          base: ""
          plugin_people: "yes"
          plugin_people_identicons: "yes"
          plugin_people_size: "40"
      - name: "Recently starred"
        uses: gh-metrics/metrics@master
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS }}
          user: RottenSea
          filename: gh-metrics/stars.svg
          output_action: none
          config_timezone: Asia/Shanghai
          base: ""
          plugin_stars: "yes"
          plugin_stars_limit: "4"
      - name: "Stargazers, classic charts"
        uses: gh-metrics/metrics@master
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS }}
          user: RottenSea
          filename: gh-metrics/stargazers.svg
          output_action: none
          config_timezone: Asia/Shanghai
          base: ""
          plugin_stargazers: "yes"
      - name: "Stargazers, graph charts"
        uses: gh-metrics/metrics@master
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS }}
          user: RottenSea
          filename: gh-metrics/stargazers-graph.svg
          output_action: none
          config_timezone: Asia/Shanghai
          base: ""
          plugin_stargazers: "yes"
          plugin_stargazers_charts_type: graph
      # The action leaves its images in /metrics_renders/, owned by root.
      - name: Collect
        run: |
          mkdir -p out
          sudo cp -r /metrics_renders/gh-metrics out/
          sudo chown -R "$(id -u):$(id -g)" out
      - uses: actions/upload-artifact@v7
        with:
          name: metrics-1
          path: out/

  metrics-2:
