# The profile README's images, one per block, committed to the cache branch every day. The README
# lays them out in a table: the Classic image and recently starred on the left; languages and
# the isometric calendar on the right, in two cells.
name: Metrics

on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    # The METRICS token lives in this environment.
    environment:
      name: production
    steps:
      - name: Classic
        uses: gh-metrics/metrics@master
        with:
          token: ${{ secrets.METRICS }}
          user: RottenSea
          filename: metrics/classic.svg
          output_action: commit
          committer_branch: cache
          committer_message: "chore: update metrics"
          config_timezone: Asia/Shanghai
          base: header, activity, community, repositories
          plugin_lines: yes
          plugin_lines_sections: base, repositories

      - name: Recently starred
        uses: gh-metrics/metrics@master
        with:
          token: ${{ secrets.METRICS }}
          user: RottenSea
          filename: metrics/stars.svg
          output_action: commit
          committer_branch: cache
          committer_message: "chore: update metrics"
          config_timezone: Asia/Shanghai
          base: ""
          plugin_stars: yes
          plugin_stars_limit: 3

      - name: Languages
        uses: gh-metrics/metrics@master
        with:
          token: ${{ secrets.METRICS }}
          user: RottenSea
          filename: metrics/languages.svg
          output_action: commit
          committer_branch: cache
          committer_message: "chore: update metrics"
          config_timezone: Asia/Shanghai
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage

      - name: Isometric calendar
        uses: gh-metrics/metrics@master
        with:
          token: ${{ secrets.METRICS }}
          user: RottenSea
          filename: metrics/isocalendar.svg
          output_action: commit
          committer_branch: cache
          committer_message: "chore: update metrics"
          config_timezone: Asia/Shanghai
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
