# The profile README's image: one gh-metrics Classic image laid out in two columns with a CSS grid,
# committed to the cache branch every day.
name: Metrics

on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    # The METRICS token lives in this environment.
    environment:
      name: production
    steps:
      - uses: gh-metrics/metrics@master
        with:
          token: ${{ secrets.METRICS }}
          user: RottenSea
          filename: metrics/profile.svg
          output_action: commit
          committer_branch: cache
          committer_message: "chore: update metrics"
          config_timezone: Asia/Shanghai
          # 960 wide, so the two columns fit side by side.
          config_display: large
          # The grid below places the sections by their position, so this order matters.
          config_order: base.header, base.activity+community, base.repositories, lines, stars, languages, isocalendar
          base: header, activity, community, repositories
          plugin_lines: yes
          plugin_lines_sections: base, repositories, history
          plugin_stars: yes
          plugin_stars_limit: 4
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          # Left column: header, activity and community, repositories, lines of code. Right column:
          # recently starred, then languages. The calendar spans both columns at the bottom.
          extras_css: |
            svg.large .items-wrapper {
              display: grid;
              grid-template-columns: 480px 460px;
              column-gap: 20px;
              align-items: start;
              grid-template-areas:
                "header stars"
                "activity stars"
                "repositories languages"
                "lines languages"
                "calendar calendar";
            }
            .items-wrapper > :nth-child(1) { grid-area: header; }
            .items-wrapper > :nth-child(2) { grid-area: activity; }
            .items-wrapper > :nth-child(3) { grid-area: repositories; }
            .items-wrapper > :nth-child(4) { grid-area: lines; }
            .items-wrapper > :nth-child(5) { grid-area: stars; }
            .items-wrapper > :nth-child(6) { grid-area: languages; }
            .items-wrapper > :nth-child(7) { grid-area: calendar; }
            /* Large display puts two starred repositories on a row; the column is too narrow. */
            svg.large .items-wrapper .largeable-width-half { width: 100%; }
